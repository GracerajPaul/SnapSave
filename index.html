
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnapSave - Secure Image Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,700;1,800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --accent: #6366f1;
        --accent-glow: rgba(99, 102, 241, 0.4);
        --bg-deep: #020617;
      }
      
      * {
        cursor: default;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg-deep);
        color: #f8fafc;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Refined Noise Texture */
      .noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url('https://grainy-gradients.vercel.app/noise.svg');
        opacity: 0.12;
        pointer-events: none;
        z-index: 9999;
        mix-blend-mode: overlay;
      }

      /* Animated High-End Background */
      .bg-grid {
        background-image: 
          radial-gradient(circle at 1.5px 1.5px, rgba(99, 102, 241, 0.08) 1px, transparent 0);
        background-size: 32px 32px;
        position: relative;
      }

      /* Dynamic Scanning Line */
      .scanline {
        width: 100%;
        height: 2px;
        z-index: 999;
        background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.15), transparent);
        position: fixed;
        top: 0;
        animation: scanline 6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        pointer-events: none;
      }

      @keyframes scanline {
        0% { transform: translateY(-10vh); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(110vh); opacity: 0; }
      }

      /* Machined Glass Architecture */
      .glass-card {
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(28px) saturate(160%);
        -webkit-backdrop-filter: blur(28px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 
          0 10px 40px -15px rgba(0, 0, 0, 0.5),
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.05);
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        transform-style: preserve-3d;
        perspective: 1000px;
      }
      
      .glass-card:hover {
        border-color: rgba(99, 102, 241, 0.4);
        background: rgba(15, 23, 42, 0.55);
        transform: translateY(-5px) rotateX(2deg) rotateY(-2deg);
        box-shadow: 
          0 40px 100px -20px rgba(0, 0, 0, 0.7),
          0 0 40px -10px rgba(99, 102, 241, 0.3);
      }

      /* 3D Tilt Effect Utilities */
      .tilt-3d {
        transform-style: preserve-3d;
        transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      }
      
      .tilt-3d:hover {
        transform: perspective(1000px) rotateX(4deg) rotateY(-4deg) scale3d(1.02, 1.02, 1.02);
      }

      .tilt-3d-reverse:hover {
        transform: perspective(1000px) rotateX(-4deg) rotateY(4deg) scale3d(1.02, 1.02, 1.02);
      }

      /* Atmospheric Depth Layer */
      .atmosphere {
        position: fixed;
        inset: 0;
        background: 
          radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 50% 50%, rgba(2, 6, 23, 1) 0%, transparent 100%);
        filter: blur(80px);
        opacity: 0.6;
        pointer-events: none;
        z-index: -1;
      }

      /* Floating Animation */
      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(1deg); }
      }
      .animate-float {
        animation: float 10s ease-in-out infinite;
      }

      .text-glow {
        text-shadow: 0 0 40px rgba(99, 102, 241, 0.5);
      }

      /* Smooth Scrollbar Integration */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #020617;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 20px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4f46e5;
      }

      /* Cyber Shimmer Effect */
      .cyber-shimmer {
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
        background-size: 200% 100%;
        animation: shimmer 8s infinite linear;
      }

      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 3s linear infinite;
      }

      /* High-Precision Input Styling */
      input:-webkit-autofill {
          -webkit-box-shadow: 0 0 0 1000px #0f172a inset !important;
          -webkit-text-fill-color: white !important;
      }
    </style>
  </head>
  <body class="bg-grid">
    <div class="noise"></div>
    <div class="scanline"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
